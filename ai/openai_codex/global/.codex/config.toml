# モデル世代は固定しない（Codex 既定に任せる）。Plan モードのみ推論量を上げる。
plan_mode_reasoning_effort = "high"

# 安全寄りのデフォルト
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "cached"

suppress_unstable_features_warning = true

# 通知音
notify = ["bash", "-lc", "afplay /System/Library/Sounds/Glass.aiff"]

# MCPサーバー
[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_PAT"
http_headers = { "X-MCP-Tools" = "get_me,issue_read,list_issues,search_issues,issue_write,add_issue_comment,pull_request_read,list_pull_requests,search_pull_requests,create_pull_request,update_pull_request,actions_list,actions_get,get_job_logs" }
enabled_tools = [
  "get_me",
  "issue_read",
  "list_issues",
  "search_issues",
  "issue_write",
  "add_issue_comment",
  "pull_request_read",
  "list_pull_requests",
  "search_pull_requests",
  "create_pull_request",
  "update_pull_request",
  "actions_list",
  "actions_get",
  "get_job_logs",
]
default_tools_approval_mode = "auto"

[mcp_servers.aws-mcp]
command = "uvx"
args = [
  "mcp-proxy-for-aws==1.6.4",
  "https://aws-mcp.us-east-1.api.aws/mcp",
  "--metadata",
  "AWS_REGION=us-west-2",
  "--read-only",
]
default_tools_approval_mode = "writes"

[mcp_servers.playwright]
command = "npx"
args = ["@playwright/mcp@latest"]

[mcp_servers.drawio]
command = "npx"
args = ["-y", "@drawio/mcp"]

[features]
voice_transcription = true
multi_agent = true

[agents]
max_threads = 6
max_depth = 2

[agents.default]
description = "汎用実装・修正 / General purpose coding helper."

[agents.explorer]
description = "探索・読解特化 / Fast read-heavy exploration."
config_file = "agents/explorer.toml"

[agents.reviewer]
description = "品質レビュー（安全性・正しさ・保守性） / Review for correctness & maintainability."
config_file = "agents/reviewer.toml"

[agents.test_runner]
description = "テスト実行と失敗収束 / Run tests and fix failures."
config_file = "agents/test_runner.toml"

[agents.security_reviewer]
description = "セキュリティ監査 / Security review for code and config."
config_file = "agents/security_reviewer.toml"

[agents.tech_researcher]
description = "一次情報ベースの技術調査 / Grounded tech research."
config_file = "agents/tech_researcher.toml"

[projects."/Users/tf/production/sc-docker-swimming-all"]
trust_level = "trusted"
