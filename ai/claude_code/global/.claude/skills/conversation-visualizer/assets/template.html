<!doctype html>
<!--
  conversation-visualizer ベーステンプレート（決定文書・スキャン優先）
  使い方: style ブロックは無変更で流用し、.shell 内だけを組み替える。固定レイアウトではない。
  - 目的: 元の会話・差分を読み直す代わりに、最初の画面で「何か／結論／次に行うこと」が掴めること。
  - 意匠: ゴシックのみ。墨と藍。塗りカードや明朝の雑誌組に頼らない。結論は大きな一文、状態はラベル＋色＋記号。
  - ライト固定。外部 CSS / フォント / CDN / JavaScript は使わない。色は token 経由のみ。
  - 使うクラス: hero / verdict / actions / facts / contents / split.panel / badge / table / flow / timeline / cols.card / callout / details
-->
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>タイトル</title>
    <style>
      :root {
        --paper: #f3f4f2;
        --ink: #17181b;
        --ink-2: #3d4148;
        --muted: #4d5258;
        --hair: #dfe1dc;
        --hair-2: #b9bdb6;
        --rule: #17181b;

        --accent: #1f5c6b;
        --accent-2: #164650;
        --accent-tint: #e4eef0;

        --ok: #1b6a43;
        --ok-2: #145234;
        --ok-tint: #e7f2eb;

        --warn: #85580a;
        --warn-2: #6a4608;
        --warn-tint: #f4eedf;

        --danger: #a12e24;
        --danger-2: #7e241c;
        --danger-tint: #f6eae8;

        --code-bg: #1c1e22;
        --code-ink: #e8e6df;
        --icode-bg: #e6e8e3;
        --icode-ink: #3d4148;

        --sans: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, system-ui, sans-serif;
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

        --measure: 54rem;
      }

      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; scroll-padding-top: 1.2rem; }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 16px;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      .shell { max-width: var(--measure); margin: 0 auto; padding: 2.1rem 1.35rem 4rem; }

      a { color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 1px; }
      a:hover { color: var(--accent-2); }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      /* ===== ヒーロー ===== */
      .hero { padding-top: 0.2rem; margin-bottom: 0.4rem; }
      .kicker {
        display: inline-block;
        font-size: 0.75rem; font-weight: 700;
        color: var(--accent); margin-bottom: 0.55rem;
        padding-left: 0.65rem; border-left: 3px solid var(--accent);
      }
      h1 {
        font-size: 1.72rem; font-weight: 800; line-height: 1.28;
        margin: 0 0 0.55rem; color: var(--ink);
      }
      .doc-meta {
        display: flex; flex-wrap: wrap; gap: 0.15rem 1.05rem;
        color: var(--muted); font-size: 0.8rem;
        padding-bottom: 1rem; border-bottom: 1px solid var(--hair-2);
      }
      .doc-meta code, .doc-footer code {
        font-family: var(--mono); font-size: 0.86em;
        background: var(--icode-bg); color: var(--icode-ink);
        padding: 0.05rem 0.34rem; border-radius: 2px;
      }

      /* 結論: 大きなゴシック一文。通常は塗らず、注意・危険だけ面を足す */
      .verdict {
        margin: 1.2rem 0 1rem;
        padding: 0.15rem 0 0.2rem 1.15rem;
        border-left: 6px solid var(--accent);
      }
      .verdict .tag {
        display: block;
        font-size: 0.72rem; font-weight: 700;
        color: var(--accent-2); margin-bottom: 0.35rem;
      }
      .verdict p {
        margin: 0;
        font-size: 1.32rem; font-weight: 800; line-height: 1.45;
        color: var(--ink);
      }
      .verdict strong { font-weight: 800; }
      .verdict code {
        font-family: var(--mono); font-size: 0.78em;
        background: var(--accent-tint); color: var(--accent-2);
        padding: 0.05rem 0.34rem; border-radius: 2px;
      }
      .verdict.ok { border-left-color: var(--ok); }
      .verdict.ok .tag { color: var(--ok-2); }
      .verdict.ok code { background: var(--ok-tint); color: var(--ok-2); }
      .verdict.warn {
        border-left-color: var(--warn); background: var(--warn-tint);
        padding: 0.85rem 1.1rem 0.9rem 1.15rem;
      }
      .verdict.warn .tag { color: var(--warn-2); }
      .verdict.warn code { background: rgba(133, 88, 10, 0.12); color: var(--warn-2); }
      .verdict.danger {
        border-left-color: var(--danger); background: var(--danger-tint);
        padding: 0.85rem 1.1rem 0.9rem 1.15rem;
      }
      .verdict.danger .tag { color: var(--danger-2); }
      .verdict.danger code { background: rgba(161, 46, 36, 0.12); color: var(--danger-2); }

      /* 次に行うこと: 結論の直後 */
      .actions {
        margin: 0 0 1.25rem;
        padding: 0.85rem 1.05rem 0.95rem;
        background: var(--accent-tint);
        border-top: 3px solid var(--accent);
      }
      .actions .label {
        display: block;
        font-size: 0.72rem; font-weight: 700;
        color: var(--accent-2); margin-bottom: 0.45rem;
      }
      .actions ol {
        margin: 0; padding-left: 1.35rem;
      }
      .actions li {
        margin-bottom: 0.28rem; font-weight: 700; line-height: 1.5;
      }
      .actions li:last-child { margin-bottom: 0; }
      .actions li span, .actions li p {
        display: block; font-weight: 400; color: var(--ink-2);
        font-size: 0.9rem; margin: 0.1rem 0 0;
      }

      /* 事実の帯: 件数に合わせて列を決める */
      .facts {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(10.5rem, 1fr));
        border-top: 2px solid var(--rule); border-bottom: 1px solid var(--hair-2);
      }
      .facts .fact { padding: 0.85rem 1.1rem 0.95rem 0; }
      .facts .fact + .fact { padding-left: 1.1rem; border-left: 1px solid var(--hair); }
      .fact .label {
        font-size: 0.72rem; font-weight: 700;
        color: var(--muted); margin-bottom: 0.28rem;
      }
      .fact .value {
        font-size: 1.08rem; font-weight: 800; line-height: 1.35; color: var(--ink);
      }
      .fact .value.ok { color: var(--ok-2); }
      .fact .value.warn { color: var(--warn-2); }
      .fact .value.danger { color: var(--danger-2); }
      .fact .note { margin-top: 0.22rem; font-size: 0.78rem; color: var(--muted); line-height: 1.45; }

      /* 収録: ページ内リンク */
      .contents {
        display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.35rem 1.1rem;
        font-size: 0.82rem;
        padding: 0.7rem 0 0.15rem; margin-bottom: 0.4rem;
      }
      .contents .c-label {
        font-size: 0.72rem; font-weight: 700; color: var(--muted);
      }
      .contents a { font-weight: 700; text-decoration: none; }
      .contents a:hover { text-decoration: underline; }

      /* ===== 使う/使わない: ✓/✕ + 色 + ラベル ===== */
      .split { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin: 1.25rem 0; }
      .panel {
        padding: 0.8rem 1rem 0.85rem;
        border-top: 3px solid var(--hair-2);
        background: #eceee9;
      }
      .panel .label {
        display: block;
        font-size: 0.75rem; font-weight: 700;
        margin-bottom: 0.45rem;
      }
      .panel ul { list-style: none; margin: 0; padding: 0; }
      .panel li { position: relative; padding-left: 1.45em; margin-bottom: 0.35rem; }
      .panel li:last-child { margin-bottom: 0; }
      .panel li::before {
        content: "・"; position: absolute; left: 0; top: 0;
        font-weight: 800; color: var(--muted);
      }
      .panel.ok { border-top-color: var(--ok); background: var(--ok-tint); }
      .panel.ok .label { color: var(--ok-2); }
      .panel.ok li::before { content: "✓"; color: var(--ok); }
      .panel.warn { border-top-color: var(--warn); background: var(--warn-tint); }
      .panel.warn .label { color: var(--warn-2); }
      .panel.warn li::before { content: "✕"; color: var(--warn); }
      .panel.danger { border-top-color: var(--danger); background: var(--danger-tint); }
      .panel.danger .label { color: var(--danger-2); }
      .panel.danger li::before { content: "✕"; color: var(--danger); }

      /* ===== 本文 ===== */
      p, ul, ol { margin: 0.45rem 0 0.9rem; }
      ul, ol { padding-left: 1.35rem; }
      li { margin-bottom: 0.28rem; }
      strong { font-weight: 700; }

      h2 {
        font-size: 1.12rem; font-weight: 800; line-height: 1.4;
        margin: 2.1rem 0 0.7rem; padding: 0.7rem 0 0.45rem;
        border-top: 1px solid var(--hair-2);
        scroll-margin-top: 1.2rem;
      }
      h2:target {
        box-shadow: inset 3px 0 var(--accent);
        padding-left: 0.7rem; margin-left: -0.7rem;
      }
      main.numbered { counter-reset: sec; }
      main.numbered h2::before {
        counter-increment: sec;
        content: counter(sec, decimal-leading-zero) " ";
        font-size: 0.78rem; font-weight: 800; color: var(--muted);
        letter-spacing: 0.04em; margin-right: 0.35rem;
      }
      h3 {
        font-size: 0.92rem; font-weight: 800;
        margin: 1.2rem 0 0.35rem; color: var(--ink-2);
      }

      .badge {
        display: inline-block;
        font-size: 0.7rem; font-weight: 700;
        padding: 0.08rem 0.4rem 0.1rem;
        border: 1px solid currentColor; border-radius: 2px; white-space: nowrap;
      }
      .badge.ok { color: var(--ok-2); }
      .badge.warn { color: var(--warn-2); }
      .badge.danger { color: var(--danger-2); }
      .badge.info { color: var(--accent); }

      /* テーブル */
      .table-wrap { overflow-x: auto; margin: 0.8rem 0 1.2rem; }
      table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
      th, td { padding: 0.5rem 0.85rem 0.5rem 0; text-align: left; vertical-align: top; }
      thead th {
        font-size: 0.72rem; font-weight: 700; color: var(--muted);
        border-bottom: 2px solid var(--rule);
      }
      tbody td { border-bottom: 1px solid var(--hair); }
      tbody tr:last-child td { border-bottom: 1px solid var(--hair-2); }
      td.num { font-variant-numeric: tabular-nums; text-align: right; padding-right: 0.5rem; }
      tr.ok td:first-child { box-shadow: inset 3px 0 var(--ok); padding-left: 0.7rem; }
      tr.warn td:first-child { box-shadow: inset 3px 0 var(--warn); padding-left: 0.7rem; }
      tr.danger td:first-child { box-shadow: inset 3px 0 var(--danger); padding-left: 0.7rem; }

      /* フロー: 番号付き手順。順序そのものが情報 */
      ol.flow {
        list-style: none; margin: 1rem 0 1.2rem; padding: 0;
        counter-reset: step;
      }
      ol.flow > li {
        position: relative;
        padding: 0.15rem 0 1rem 2.6rem;
        border-left: 1px solid var(--hair-2);
        margin-left: 0.7rem;
      }
      ol.flow > li:last-child { border-left-color: transparent; padding-bottom: 0; }
      ol.flow > li::before {
        counter-increment: step;
        content: counter(step);
        position: absolute; left: -0.8rem; top: 0.12rem;
        width: 1.55rem; height: 1.55rem;
        background: var(--ink); color: var(--paper);
        font-size: 0.72rem; font-weight: 800; line-height: 1.55rem;
        text-align: center; border-radius: 50%;
      }
      ol.flow > li > strong { display: block; font-size: 0.95rem; }
      ol.flow > li > span, ol.flow > li > p {
        display: block; margin: 0.15rem 0 0; color: var(--ink-2); font-size: 0.88rem;
      }
      .flow-branch { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: 0.75rem; width: 100%; margin: 0.3rem 0 1.1rem; }
      .branch { border: 1px solid var(--hair); border-top: 3px solid var(--accent); padding: 0.7rem 0.85rem; font-size: 0.88rem; }
      .branch > .branch-label {
        display: inline-block; font-size: 0.72rem; font-weight: 700;
        margin-bottom: 0.35rem; color: var(--accent);
      }
      .branch.ok { border-top-color: var(--ok); background: var(--ok-tint); }
      .branch.ok > .branch-label { color: var(--ok-2); }
      .branch.warn { border-top-color: var(--warn); background: var(--warn-tint); }
      .branch.warn > .branch-label { color: var(--warn-2); }
      .branch.danger { border-top-color: var(--danger); background: var(--danger-tint); }
      .branch.danger > .branch-label { color: var(--danger-2); }

      /* タイムライン */
      .timeline { list-style: none; margin: 1rem 0 1.2rem; padding: 0; }
      .timeline li {
        position: relative; padding: 0 0 0.85rem 1.55rem;
        border-left: 1px solid var(--hair-2); margin-left: 0.4rem;
      }
      .timeline li:last-child { border-left-color: transparent; padding-bottom: 0; }
      .timeline li::before {
        content: ""; position: absolute; left: -0.32rem; top: 0.5em;
        width: 0.55rem; height: 0.55rem; background: var(--accent);
        border: 2px solid var(--paper);
      }
      .timeline li.warn::before { background: var(--warn); }
      .timeline li.danger::before { background: var(--danger); }
      .timeline li.ok::before { background: var(--ok); }
      .timeline .time {
        font-weight: 700; font-variant-numeric: tabular-nums;
        color: var(--ink-2); margin-right: 0.5em; font-size: 0.86rem;
      }

      /* カード */
      .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: 1rem; margin: 0.9rem 0 1.2rem; }
      .card { border-top: 2px solid var(--hair-2); padding-top: 0.65rem; }
      .card h3 { margin-top: 0; }
      .card.recommended { border-top-color: var(--accent); }
      .card.recommended h3 .badge {
        font-size: 0.68rem; vertical-align: 0.12em; margin-left: 0.35rem;
        color: var(--paper); background: var(--accent); border-color: var(--accent);
      }

      /* コールアウト */
      .callout {
        border-left: 4px solid var(--accent); background: var(--accent-tint);
        padding: 0.75rem 1rem; margin: 0.9rem 0; font-size: 0.93rem;
      }
      .callout .label {
        display: block; font-size: 0.72rem; font-weight: 700;
        color: var(--accent-2); margin-bottom: 0.25rem;
      }
      .callout code { background: rgba(31, 92, 107, 0.12); color: var(--accent-2); padding: 0.05rem 0.32rem; border-radius: 2px; }
      .callout.warn { border-left-color: var(--warn); background: var(--warn-tint); }
      .callout.warn .label { color: var(--warn-2); }
      .callout.warn code { background: rgba(133, 88, 10, 0.12); color: var(--warn-2); }
      .callout.danger { border-left-color: var(--danger); background: var(--danger-tint); }
      .callout.danger .label { color: var(--danger-2); }
      .callout.danger code { background: rgba(161, 46, 36, 0.12); color: var(--danger-2); }
      .callout p:last-child, .callout ul:last-child { margin-bottom: 0; }

      /* 折りたたみ */
      details { border-top: 1px solid var(--hair-2); border-bottom: 1px solid var(--hair-2); margin: 1rem 0; }
      summary {
        cursor: pointer; font-weight: 800; font-size: 0.92rem;
        min-height: 2.75rem; padding: 0.7rem 0; color: var(--ink-2);
        list-style: none; display: flex; align-items: center;
      }
      summary::-webkit-details-marker { display: none; }
      summary::before { content: "＋"; display: inline-block; width: 1.3em; color: var(--accent); font-weight: 700; }
      details[open] > summary::before { content: "−"; }
      details[open] > summary { border-bottom: 1px solid var(--hair); margin-bottom: 0.65rem; }
      details > :last-child { margin-bottom: 0.9rem; }

      /* コード */
      pre {
        background: var(--code-bg); color: var(--code-ink); border-radius: 3px;
        padding: 0.85rem 1rem; overflow-x: auto;
        font-size: 0.8rem; line-height: 1.6; margin: 0.45rem 0 0.95rem;
      }
      code { font-family: var(--mono); font-size: 0.9em; }
      p code, li code, td code, summary code, h2 code, h3 code {
        background: var(--icode-bg); color: var(--icode-ink);
        border-radius: 2px; padding: 0.05rem 0.34rem;
      }

      /* フッター */
      .doc-footer {
        margin-top: 2.2rem; color: var(--muted); font-size: 0.78rem;
        padding-top: 0.85rem; border-top: 2px solid var(--rule);
      }

      @media (max-width: 720px) {
        .facts { grid-template-columns: 1fr; }
        .facts .fact + .fact { border-left: none; padding-left: 0; border-top: 1px solid var(--hair); }
        .split { grid-template-columns: 1fr; }
        h1 { font-size: 1.45rem; }
        .verdict p { font-size: 1.12rem; }
      }

      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
      }

      @media print {
        body { background: #fff; }
        .verdict, .panel, .callout, .branch, .actions { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .contents { display: none; }
        details > summary { display: none; }
        details:not([open]) > *:not(summary) { display: block; }
        a { color: inherit; text-decoration: none; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <section class="hero">
        <div class="kicker">文書の種別</div>
        <h1>タイトル</h1>
        <div class="doc-meta">
          <span>対象: <code>path.md</code></span>
          <span>生成: YYYY-MM-DD</span>
        </div>

        <div class="verdict">
          <span class="tag">結論</span>
          <p><strong>一文で言い切る。</strong>注意・危険のときだけ warn / danger。</p>
        </div>

        <div class="actions">
          <div class="label">次に行うこと</div>
          <ol>
            <li>最初にやることを書く</li>
          </ol>
        </div>

        <div class="facts">
          <div class="fact">
            <div class="label">何か</div>
            <div class="value">種別を短く</div>
            <div class="note">補足があれば一行</div>
          </div>
          <div class="fact">
            <div class="label">状態</div>
            <div class="value ok">判断に効く値だけ</div>
          </div>
        </div>

        <nav class="contents" aria-label="収録">
          <span class="c-label">収録</span>
          <a href="#sec-decided">決まったこと</a>
          <a href="#sec-detail">詳細</a>
        </nav>
      </section>

      <div class="split">
        <div class="panel ok">
          <span class="label">使うとき</span>
          <ul>
            <li>…</li>
          </ul>
        </div>
        <div class="panel warn">
          <span class="label">使わないとき</span>
          <ul>
            <li>…</li>
          </ul>
        </div>
      </div>

      <main>
        <h2 id="sec-decided">決まったこと</h2>
        <p>必要な人向けの本文。表・手順・タイムラインは情報の型に合わせて使う。</p>

        <h2 id="sec-detail">詳細</h2>
        <details>
          <summary>長い手順・根拠は折りたたむ</summary>
          <p>詳細をここに入れる。</p>
        </details>
      </main>

      <footer class="doc-footer">
        対象: <code>path.md</code> ／ 生成日: YYYY-MM-DD ／ 要点把握用の生成物（正本ではない）
      </footer>
    </div>
  </body>
</html>
